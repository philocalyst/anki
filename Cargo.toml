[package]
name = "flash"
version = "0.1.0"
edition = "2024"

[dependencies]
ariadne = "0.5.1"
chumsky = "1.0.0-alpha.8"
clap = { version = "4.6.0", features = ["derive"] }
color-eyre = "0.6.5"
dir_spec = "0.5.2"
evalexpr = { git = "https://github.com/philocalyst/evalexpr", features = ["serde"]}
eyre = "0.6.12"
fs-err = "3.1.1"
gix = "0.74.1"
jotdown = { version = "0.10.0", features = ["deterministic"] }
logos = "0.16.0"
opentelemetry = "0.31.0"
opentelemetry-stdout = "0.31.0"
opentelemetry_sdk = "0.31.0"
ordered-float = { version = "5.1.0", features = ["serde"] }
rhai = "1.25.1"
semver = { version = "1.0.26", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sonic-rs = "0.5.6"
thiserror = "2.0.17"
toml = "0.9.4"
tracing = "0.1.41"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3.20", features = ["chrono", "env-filter"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }

[features]
default = ["serde"]
serde = []

[dev-dependencies]
tempfile = "3.23.0"

[workspace.lints.rust]
mismatched_lifetime_syntaxes = "deny"
unused_imports = "deny"
unused_must_use = "deny"
dead_code = "deny"
unstable_name_collisions = "deny"
unused_assignments = "deny"
deprecated = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# deny
filetype_is_file = "deny"
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic = "deny"
match_like_matches_macro = "deny"
needless_update = "deny"
expect_used = "deny"

# allow
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
empty_docs = "allow"
unnecessary_debug_formatting = "allow"

# allow
significant_drop_tightening = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"

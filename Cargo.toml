[package]
name = "flash"
version = "0.1.0"
edition = "2024"

[dependencies]
ankit = "*"
ariadne = "*"
base64 = "*"
chumsky = "*"
clap = { version = "*", features = ["derive"] }
color-eyre = "*"
dir_spec = "*"
evalexpr = { git = "https://github.com/philocalyst/evalexpr", features = ["serde"]}
eyre = "*"
fs-err = "*"
gix = "*"
jotdown = { version = "*", features = ["deterministic"] }
logos = "*"
opentelemetry = "*"
opentelemetry-stdout = "*"
opentelemetry_sdk = "*"
ordered-float = { version = "*", features = ["serde"] }
rand = "0.10.1"
rhai = "*"
semver = { version = "*", features = ["serde"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
sonic-rs = "*"
thiserror = "*"
tokio = { version = "*", features = ["full"] }
toml = "*"
tracing = "*"
tracing-opentelemetry = "*"
tracing-subscriber = { version = "*", features = ["chrono", "env-filter"] }
uuid = { version = "*", features = ["serde", "v4", "v5"] }

[features]
default = ["serde"]
serde = []

[dev-dependencies]
tempfile = "3.23.0"

[workspace.lints.rust]
mismatched_lifetime_syntaxes = "deny"
unused_imports = "deny"
unused_must_use = "deny"
dead_code = "deny"
unstable_name_collisions = "deny"
unused_assignments = "deny"
deprecated = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# deny
filetype_is_file = "deny"
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic = "deny"
match_like_matches_macro = "deny"
needless_update = "deny"
expect_used = "deny"

# allow
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
empty_docs = "allow"
unnecessary_debug_formatting = "allow"

# allow
significant_drop_tightening = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
